bundle:
  name: hotel_booking_ingest

include:
  - resources/*.yml

variables:
  catalog:
    description: Unity Catalog catalog the medallion tables are written to.
  schema:
    description: Schema (within the catalog) for bronze/silver/gold tables and the raw Volume.
  cancel_model_version:
    description: >-
      Numeric UC model version served by the hotel-cancel-classifier endpoint. Resolve from
      the @champion alias at deploy time (see resources/hotel_cancel_serving.yml).
    default: "1"

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fevm-fe-bar-ecastillo.cloud.databricks.com
    variables:
      catalog: fe_bar_ecastillo_catalog
      schema: hotel_booking_dev

  prod:
    mode: production
    workspace:
      host: https://fevm-fe-bar-ecastillo.cloud.databricks.com
    variables:
      catalog: fe_bar_ecastillo_catalog
      schema: hotel_booking
