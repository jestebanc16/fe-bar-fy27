resources:
  jobs:
    hotel_cancel_ml:
      name: hotel_cancel_ml
      description: >-
        End-to-end cancellation-model refresh: train + register
        hotel_cancel_classifier@champion, then batch-score reservation_risk. Run:
        `databricks bundle run hotel_cancel_ml -t dev`.
      tasks:
        - task_key: train
          notebook_task:
            notebook_path: ../src/hotel_booking_ml/train_cancel_classifier.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: default
        - task_key: score
          depends_on:
            - task_key: train
          notebook_task:
            notebook_path: ../src/hotel_booking_ml/score_bookings.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.schema}
          environment_key: default
      environments:
        - environment_key: default
          spec:
            client: "3"
